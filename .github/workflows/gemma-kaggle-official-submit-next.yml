name: Official Kaggle submission (next candidate)

# Guarded, one-shot upload of ONE committed archive. Nothing runs until either
#   * gemma4-agent/kaggle_smoke/official-submit-v612.trigger  (default: the submission arm)
#   * gemma4-agent/kaggle_smoke/official-submit-v611.trigger  (the aggressive 8-minute arm)
# is pushed, or the workflow is dispatched manually with an explicit artifact choice.
#
# A trigger push ARMS a timed send only when it is needed: the step reads our own submission
# receipts, sends immediately if the daily slot is open, and otherwise sleeps until 00:10 UTC, the
# moment the
# competition's daily submission slot refreshes (02:05 Warsaw), so the submitted day is the new UTC
# day and the following day's slot opens at the same hour instead of being blocked for 24 h from
# e.g. 20:00 UTC. The wait is refused (nothing sent, trigger left in place) when the boundary is
# more than MAX_WAIT_HOURS away; manual dispatch defaults to sending immediately.
#
# The guard chain (tools/submit_kaggle_once.py) is: the archive must hash to the value pinned below
# for that artifact (so the uploaded bytes are the reviewed build), the message must not already
# exist in the competition history, and no submission may exist from today or the last 24 hours
# (competition limit: one submission per day). Kaggle authentication uses the repository secret;
# the token is never printed. The job id contains no dots after the 2026-10-15 incident where a dot
# in a job id made GitHub report a phantom failed run on every push.

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Which committed archive to submit"
        type: choice
        required: true
        default: v612
        options:
          - v7b
          - v612
          - v611
          - v610
          - v68
      mode:
        description: "send_now = submit as soon as the guards pass; wait_boundary = sleep until 00:05 UTC"
        type: choice
        required: true
        default: send_now
        options:
          - send_now
          - wait_boundary
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/official-submit-v7b.trigger
      - gemma4-agent/kaggle_smoke/official-submit-v612.trigger
      - gemma4-agent/kaggle_smoke/official-submit-v611.trigger

permissions:
  contents: write

concurrency:
  group: gemma-official-submit-next-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit-next:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide whether to send now or wait for the daily boundary
        id: wait
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          MAX_WAIT_HOURS: "5"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import glob
          import json
          import os
          import sys
          import time

          TOLERANCE_MINUTES = 5
          event = os.environ.get("EVENT_NAME", "")
          mode = (os.environ.get("REQUESTED_MODE") or "").strip()
          if event != "push" and mode != "wait_boundary":
              print("Mode: send now (no boundary wait requested).")
              sys.exit(0)

          def parse(value):
              if not value:
                  return None
              text = str(value).strip().replace(" ", "T", 1)
              try:
                  parsed = dt.datetime.fromisoformat(text)
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=dt.timezone.utc)
              return parsed.astimezone(dt.timezone.utc)

          # The decision is data-driven: how long ago did we actually get a submission through?
          # Waiting for the boundary is worth it only when a recent submission would otherwise block
          # the window right after it. On 2026-10-17 00:05:05 the guard blocked the V7-b upload by
          # two seconds (the previous submission was 23 h 59 m 58 s old), so this step both targets
          # 00:10 UTC and reads the receipts instead of guessing.
          newest = None
          for path in sorted(glob.glob("gemma4-agent/kaggle_results/*official-submission*.json")):
              try:
                  record = json.load(open(path, encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              submission = record.get("submission") or {}
              if not record.get("submission_created") or not submission:
                  continue
              moment = parse(submission.get("date"))
              if moment and (newest is None or moment > newest):
                  newest = moment

          now = dt.datetime.now(dt.timezone.utc)
          boundary = now.replace(hour=0, minute=10, second=0, microsecond=0)
          if boundary <= now:
              boundary += dt.timedelta(days=1)
          delta = (boundary - now).total_seconds()

          if newest is not None:
              age = (now - newest).total_seconds() / 3600
              print(f"Newest recorded submission: {newest:%Y-%m-%d %H:%M} UTC ({age:.1f} h ago).")
              recent = age < 24 - TOLERANCE_MINUTES / 60
          else:
              print("No recorded submission found in the receipts.")
              recent = False

          if not recent:
              print("The daily slot is open; sending now instead of sleeping to the boundary.")
              sys.exit(0)

          max_wait = float(os.environ.get("MAX_WAIT_HOURS", "5")) * 3600
          if delta > max_wait:
              print(
                  f"Refusing to arm: the last submission is recent and the next boundary is "
                  f"{boundary:%Y-%m-%d %H:%M} UTC, {delta / 3600:.1f} h away (limit {max_wait / 3600:.0f} h). "
                  "Nothing was submitted and the trigger file was left in place - push it again closer "
                  "to the boundary.",
                  flush=True,
              )
              sys.exit(1)
          print(
              f"Armed: waiting {delta / 60:.1f} min for {boundary:%Y-%m-%d %H:%M} UTC, when the "
              "rolling 24-hour window and the daily boundary both clear.",
              flush=True,
          )
          time.sleep(delta)
          print("Boundary reached at", dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"), flush=True)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Select the artifact and stage it as submission.zip
        id: select
        run: |
          set -euo pipefail
          choice="${{ github.event.inputs.artifact }}"
          if [ -z "$choice" ]; then
            # Exactly one trigger file is ever pushed, so the trigger that is present names the arm.
            for candidate in v7b v612 v611; do
              if [ -f "gemma4-agent/kaggle_smoke/official-submit-${candidate}.trigger" ]; then
                choice="$candidate"
                break
              fi
            done
            choice="${choice:-v7b}"
          fi
          case "$choice" in
            v7b)  zip=submission-v7b.zip;  msg=V7b;  sha=e35f20ab1361450d1877010188620d130117e657492a7b48d2c49d681086886e ;;
            v612) zip=submission-v6.12.zip; msg=V6.12; sha=5381ae17398f88ba434313439d9b784103dbab514bd7a0a3798a142f3c84c515 ;;
            v611) zip=submission-v6.11.zip; msg=V6.11; sha=7b2beec178e1d8210d607abd11c1d5a24fd6252e9879467adf568f2b8b05202e ;;
            v610) zip=submission-v6.10.zip; msg=V6.10; sha=523d43fb458ec1befa702416619ca79a0f562475ca3249749bd297fa91b527b0 ;;
            v68)  zip=submission-v6.8.zip;  msg=V6.8;  sha=8c816fc836436ea60c8b563ae5526d78c3906779e41cbf5f4017c6c93e38573b ;;
            *)    echo "Unknown artifact choice: $choice"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/upload"
          cp "gemma4-agent/$zip" "$RUNNER_TEMP/upload/submission.zip"
          echo "Selected $zip as submission.zip (message $msg, sha256 ${sha:0:12}...)"
          {
            echo "zip=$zip"
            echo "msg=$msg"
            echo "sha=$sha"
            echo "receipt=gemma4-agent/kaggle_results/${choice}-official-submission.json"
          } >> "$GITHUB_OUTPUT"

      - name: Submit once if the daily slot is available
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          python gemma4-agent/tools/submit_kaggle_once.py \
            --archive "$RUNNER_TEMP/upload/submission.zip" \
            --message "${{ steps.select.outputs.msg }}" \
            --expected-sha256 "${{ steps.select.outputs.sha }}" \
            --result-json "${{ steps.select.outputs.receipt }}"

      - name: Show submission receipt
        if: always() && steps.wait.outcome == 'success'
        run: |
          receipt="${{ steps.select.outputs.receipt }}"
          if [ -n "$receipt" ] && [ -f "$receipt" ]; then
            cat "$receipt"
          else
            echo "No receipt file was produced."
          fi

      - name: Record the receipt and consume the trigger
        if: always() && steps.wait.outcome == 'success' && steps.select.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN (see gemma-kaggle-v610-benchmark.yml): take the REMOTE tree first, then
          # re-apply only this run's outputs, so commits pushed while the job ran are not reverted.
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/kaggle_results /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp -r /tmp/keep/kaggle_results/. gemma4-agent/kaggle_results/ 2>/dev/null || true
          git add gemma4-agent/kaggle_results 2>/dev/null || true
          git rm -q --ignore-unmatch \
            gemma4-agent/kaggle_smoke/official-submit-v7b.trigger \
            gemma4-agent/kaggle_smoke/official-submit-v612.trigger \
            gemma4-agent/kaggle_smoke/official-submit-v611.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to record."
            exit 0
          fi
          git commit -m "chore(gemma): record official submission attempt [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
