name: Gemma V1 smoke notebook logs

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6d081d52-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/logs.trigger

permissions:
  contents: read

concurrency:
  group: gemma-v1-smoke-logs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Fetch private smoke notebook logs (read-only)
        run: |
          python gemma4-agent/tools/fetch_kaggle_kernel_log.py \
            --run-json gemma4-agent/kaggle_results/v1-smoke/run.json \
            --output-dir "$RUNNER_TEMP/gemma-v1-kernel-logs"

      - name: Expose concise failure diagnostics as check annotations
        if: always()
        run: |
          python gemma4-agent/tools/summarize_kaggle_kernel_log.py \
            "$RUNNER_TEMP/gemma-v1-kernel-logs/kernel.log"

      - name: Upload private notebook logs as a temporary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v1-kernel-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/gemma-v1-kernel-logs/
          if-no-files-found: warn
          retention-days: 3
