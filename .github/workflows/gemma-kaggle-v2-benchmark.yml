name: Gemma 4 LoRA SFT (canary, training, holdout)

# CARRIER NOTE (2026-10-17): GitHub is not registering new workflow files for this repository - the
# v67/v68/v69/v610/v611 benchmark workflows and the new v7c file are absent from /actions/workflows
# while pre-existing files keep working, content edits included. The V2 benchmark this file used to
# carry is long dead, so the file now carries the LoRA pipeline and keeps its registered trigger
# path byte-identical (gemma4-agent/kaggle_smoke/v2-benchmark.trigger).
#
# What runs: gemma4-agent/tools/run_kaggle_sft.py patches kaggle_smoke/gemma-lora-sft-v1.ipynb onto
# the V5 base (the only configuration with a positive official score) and the mounted model path,
# refuses to push if any patch does not apply, then launches the notebook as a private GPU kernel
# with internet (training libraries), polls it and downloads the output.
#
# The notebook's four gates live in gemma4-agent/SFT_PLAN.md: G-canary (a random rank-8 adapter over
# ALL layers must move logprobs - the sample adapter's layer-0-only config is why adapters looked
# inert), QLoRA training, G-holdout (adapter must beat the base on gold-file hits with identical
# prompts) and packaging. It never creates a competition submission.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = 6-task canary; full = the real run"
        type: choice
        required: true
        default: smoke
        options:
          - diagnose
          - smoke
          - full
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v2-benchmark.trigger
      - gemma4-agent/kaggle_smoke/sft-logfetch.trigger
      - gemma4-agent/kaggle_smoke/sft-diagnose.trigger
      - gemma4-agent/kaggle_smoke/sft-trainprobe.trigger

permissions:
  contents: write

concurrency:
  group: gemma-sft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sft:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Fetch the failed kernel's log instead of launching a new one
        id: logfetch
        run: |
          set -euo pipefail
          if [ ! -f gemma4-agent/kaggle_smoke/sft-logfetch.trigger ]; then
            echo "should_fetch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_fetch=true" >> "$GITHUB_OUTPUT"
          for d in gemma4-agent/kaggle_results/sft-smoke gemma4-agent/kaggle_results/sft-full; do
            if [ -s "$d/run.json" ]; then
              echo "fetching logs for $d"
              python gemma4-agent/tools/fetch_kaggle_kernel_log.py --run-json "$d/run.json" --output-dir "$RUNNER_TEMP/kernellogs" || true
            fi
          done
          if [ -f "$RUNNER_TEMP/kernellogs/kernel.log" ]; then
            echo "=== last 200 log lines ==="
            tail -200 "$RUNNER_TEMP/kernellogs/kernel.log"
            echo "=== python tracebacks ==="
            grep -n -A12 -E "Traceback \(most recent" "$RUNNER_TEMP/kernellogs/kernel.log" | tail -120 || echo "(no traceback)"
            # The Actions log API has been returning EOF, so persist what matters in the repository.
            {
              echo "# Kernel log (tail) - fetched $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              echo '```'
              tail -150 "$RUNNER_TEMP/kernellogs/kernel.log"
              echo '```'
              echo
              echo "## Tracebacks"
              echo '```'
              grep -n -B2 -A15 -E "Traceback \(most recent" "$RUNNER_TEMP/kernellogs/kernel.log" | tail -160 || echo "(none)"
              echo '```'
            } > gemma4-agent/kaggle_results/sft-smoke/kernel_log_tail.md
          else
            echo "no log retrieved"
          fi

      - name: Run the LoRA pipeline on competition GPU
        if: steps.logfetch.outputs.should_fetch != 'true'
        env:
          KAGGLE_USERNAME: petersharps
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -uo pipefail
          mode="${REQUESTED_MODE:-smoke}"
          if [ -f gemma4-agent/kaggle_smoke/sft-diagnose.trigger ]; then
            mode=diagnose
          fi
          if [ -f gemma4-agent/kaggle_smoke/sft-trainprobe.trigger ]; then
            mode=trainprobe
          fi
          if [ "$mode" = "trainprobe" ]; then
            echo "Mode: trainprobe (CPU only: load the 31B, attach LoRA, one step)"
            python gemma4-agent/tools/diagnose_gemma4_env.py --outdir gemma4-agent/kaggle_results/gemma4-train-probe --image competition --phase train --max-wait-minutes 90
            exit $?
          fi
          if [ "$mode" = "diagnose" ]; then
            echo "Mode: diagnose (CPU only, no GPU quota)"
            python gemma4-agent/tools/diagnose_gemma4_env.py --outdir gemma4-agent/kaggle_results/gemma4-env-competition --image competition --max-wait-minutes 40
            exit $?
          fi
          if [ "$mode" = "full" ]; then
            outdir=gemma4-agent/kaggle_results/sft-full
            flag=--full
            wait=280
          else
            outdir=gemma4-agent/kaggle_results/sft-smoke
            flag=--smoke
            wait=110
          fi
          echo "Mode: $mode -> $outdir"
          python gemma4-agent/tools/run_kaggle_sft.py \
            --base-dir submission-v5 \
            $flag \
            --outdir "$outdir" \
            --max-wait-minutes "$wait" \
            --poll-interval-seconds 60

      - name: Show the run record
        if: always()
        run: |
          for f in gemma4-agent/kaggle_results/sft-smoke/run.json gemma4-agent/kaggle_results/sft-full/run.json; do
            if [ -f "$f" ]; then
              echo "--- $f"
              cat "$f"
            fi
          done

      - name: Upload the SFT output (adapter, metrics, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-sft-${{ github.run_id }}
          path: |
            gemma4-agent/kaggle_results/sft-smoke
            gemma4-agent/kaggle_results/sft-full
            gemma4-agent/kaggle_results/gemma4-env
            gemma4-agent/kaggle_results/gemma4-env-competition
            gemma4-agent/kaggle_results/gemma4-train-probe
            ${{ runner.temp }}/kernellogs/
          if-no-files-found: warn
          retention-days: 14

      - name: Record the run and consume the trigger
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN (see GATES_V6_3.md): take the REMOTE tree first, then re-apply this run's
          # outputs, so commits pushed while the kernel ran are never reverted. Only the small run
          # records are committed; the adapter itself stays an artifact because .safetensors does
          # not belong in Git history.
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/kaggle_results/sft-smoke /tmp/keep/ 2>/dev/null || true
          cp -r gemma4-agent/kaggle_results/sft-full /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          for d in sft-smoke sft-full gemma4-env gemma4-env-competition gemma4-train-probe; do
            if [ -d "/tmp/keep/$d" ]; then
              mkdir -p "gemma4-agent/kaggle_results/$d"
              cp /tmp/keep/$d/*.json "gemma4-agent/kaggle_results/$d/" 2>/dev/null || true
              cp /tmp/keep/$d/*.md "gemma4-agent/kaggle_results/$d/" 2>/dev/null || true
              cp /tmp/keep/$d/*.jsonl "gemma4-agent/kaggle_results/$d/" 2>/dev/null || true
            fi
          done
          git add gemma4-agent/kaggle_results 2>/dev/null || true
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v2-benchmark.trigger \
            gemma4-agent/kaggle_smoke/sft-logfetch.trigger \
            gemma4-agent/kaggle_smoke/sft-diagnose.trigger \
            gemma4-agent/kaggle_smoke/sft-trainprobe.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to record."
            exit 0
          fi
          git commit -m "chore(gemma): record the LoRA SFT run [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
