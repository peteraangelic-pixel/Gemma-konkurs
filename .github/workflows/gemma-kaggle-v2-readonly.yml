name: Gemma V2 Kaggle read-only snapshot

on:
  push:
    branches:
      - arena/6d081d52-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v2-benchmark-readonly.trigger

permissions:
  contents: write

concurrency:
  group: gemma-v2-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Read existing Kaggle kernel status, logs, and completed output
        run: |
          python gemma4-agent/tools/collect_kaggle_v2_readonly.py \
            --run-json gemma4-agent/kaggle_results/v2-benchmark/run.json \
            --summary-json gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.json \
            --summary-md gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.md \
            --raw-dir "$RUNNER_TEMP/gemma-v2-readonly"

      - name: Add concise report to the Actions summary
        if: always()
        run: |
          if [ -f gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.md ]; then
            cat gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw Kaggle notebook log (temporary artifact only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v2-readonly-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gemma-v2-readonly/
          if-no-files-found: warn
          retention-days: 3

      - name: Commit sanitized read-only snapshot to this branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          if [ -n "$(git status --porcelain gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.json gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.md)" ]; then
            git add gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.json gemma4-agent/kaggle_results/v2-benchmark/readonly_snapshot.md
            git commit -m "chore(gemma): collect read-only V2 Kaggle diagnostics [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No read-only snapshot changes to commit."
          fi
