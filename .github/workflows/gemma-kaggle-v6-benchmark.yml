name: Gemma V6 stratified Kaggle benchmark

# Private, same-seed screening of the V6 archive on the competition L4x4 machine.
# V6 = V5 + the measured locator-first localization step, so running it produces the
# V5-vs-V6 comparison on exactly the same 30 tasks and seed.
# Does not create an official submission. Nothing runs until
# gemma4-agent/kaggle_smoke/v6-benchmark.trigger is pushed (or this workflow is
# dispatched manually), so pushing these files cannot consume GPU quota.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v6-benchmark.trigger

permissions:
  contents: write

concurrency:
  group: gemma-v6-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Run private same-seed 30-task V6 benchmark on competition L4x4
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          python gemma4-agent/tools/run_kaggle_v1_smoke.py \
            --submission gemma4-agent/submission-v6.zip \
            --outdir gemma4-agent/kaggle_results/v6-benchmark \
            --task-count 30 \
            --task-id fastapi_15588 \
            --seed 20261009 \
            --max-wait-minutes 240 \
            --poll-interval-seconds 60

      - name: Fetch Kaggle notebook log after failure (read-only)
        if: failure()
        continue-on-error: true
        run: |
          if [ -s gemma4-agent/kaggle_results/v6-benchmark/run.json ]; then
            python gemma4-agent/tools/fetch_kaggle_kernel_log.py \
              --run-json gemma4-agent/kaggle_results/v6-benchmark/run.json \
              --output-dir "$RUNNER_TEMP/gemma-v6-kernel-logs"
            python gemma4-agent/tools/summarize_kaggle_kernel_log.py \
              "$RUNNER_TEMP/gemma-v6-kernel-logs/kernel.log"
          else
            echo "No Kaggle kernel reference was recorded; no log fetch attempted."
          fi

      - name: Remove raw task patches before persistence
        if: always()
        run: rm -f gemma4-agent/kaggle_results/v6-benchmark/agent_benchmark_patches.txt

      - name: Upload V6 benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v6-benchmark-${{ github.run_id }}
          path: |
            gemma4-agent/kaggle_results/v6-benchmark/run.json
            gemma4-agent/kaggle_results/v6-benchmark/agent_benchmark_result.json
          if-no-files-found: warn

      - name: Upload Kaggle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v6-kernel-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gemma-v6-kernel-logs/
          if-no-files-found: warn
          retention-days: 3

      - name: Commit V6 benchmark summary to this branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # Rebase-free (the V6.2 run failed here while other commits were landing on the
          # branch): keep the worktree, move the branch pointer to the remote tip, then commit
          # only the result files.
          git reset --soft "origin/$GITHUB_REF_NAME"
          git add gemma4-agent/kaggle_results/v6-benchmark/run.json                   gemma4-agent/kaggle_results/v6-benchmark/agent_benchmark_result.json                   gemma4-agent/kaggle_results/screening_history.md
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No benchmark result files were produced."
            exit 0
          fi
          python gemma4-agent/tools/compare_screenings.py || true
          git add gemma4-agent/kaggle_results/screening_history.md || true
          git commit -m "chore(gemma): record V6 public benchmark [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
