# Read-only diagnostics for the finished V6.3 kernels: no GPU, no Kaggle jobs, no submission.
# It fetches (a) the notebook logs and (b) the output files of the two kernels that already ran:
#   full 30-task screening: petersharps/gemma-agent-benchmark-650e1dba-20261013-010824
#   mini-screen (4 tasks):  petersharps/gemma-agent-benchmark-abf22bac-20261013-005906
# 'kaggle kernels logs' and 'kaggle kernels output' only transfer files of an already finished
# version. Per the 2026-10-13 review, we look for operational traces (timing, tool names, the
# moment of the first edit, submit_patch calls), not at the model's raw reasoning.
#
# Nothing runs until gemma4-agent/kaggle_smoke/v63-logfetch.trigger is pushed.

name: Gemma V6.3 read-only kernel diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v63-logfetch.trigger

permissions:
  contents: write

concurrency:
  group: v63-logfetch.trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/c4eeb067-gemma-konkurs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Fetch kernel logs and output files (read-only)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v63-logs" "$RUNNER_TEMP/v63-outputs"
          while read -r name ref; do
            echo "--- $name ($ref) ---"
            python -m kaggle kernels logs "$ref" > "$RUNNER_TEMP/v63-logs/$name.log" 2>&1 \
              || echo "log fetch failed for $ref (recorded as-is)"
            python -m kaggle kernels output "$ref" -p "$RUNNER_TEMP/v63-outputs/$name" \
              || echo "output fetch failed for $ref (recorded as-is)"
          done <<'REFS'
          v63-full petersharps/gemma-agent-benchmark-650e1dba-20261013-010824
          v63-mini petersharps/gemma-agent-benchmark-abf22bac-20261013-005906
          REFS
          echo "--- sizes ---"
          find "$RUNNER_TEMP/v63-logs" "$RUNNER_TEMP/v63-outputs" -type f -printf '%10s  %p\n' 2>/dev/null || true

      - name: Extract operational traces (no raw reasoning)
        run: |
          set -euo pipefail
          python3 gemma4-agent/tools/extract_operational_trace.py \
            --logs-dir "$RUNNER_TEMP/v63-logs" \
            --outputs-dir "$RUNNER_TEMP/v63-outputs" \
            --out gemma4-agent/kaggle_results/v6-3-diagnostics

      - name: Commit diagnostics with the safe pattern
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN - see the other workflows (2026-10-13 incident).
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/kaggle_results/v6-3-diagnostics /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          cp -r /tmp/keep/v6-3-diagnostics gemma4-agent/kaggle_results/ 2>/dev/null || true
          git add -f gemma4-agent/kaggle_results/v6-3-diagnostics 2>/dev/null || true
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v63-logfetch.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to commit: no diagnostics were produced."
            exit 0
          fi
          git commit -m "chore(gemma): record read-only kernel diagnostics for the V6.3 runs [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
