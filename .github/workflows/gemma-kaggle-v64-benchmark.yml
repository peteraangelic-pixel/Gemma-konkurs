name: Gemma Kaggle V7-c clock screen

# Measurement only: does an 8-minute per-task clock keep the MEAN task duration inside the
# competition's 12-hour whole-run limit? V7-c is the V5 archive with exactly one changed value
# (max_time_minutes 5.25 -> 8.0); agent.yaml, configs/sampling.yaml and prompts/system.md are
# byte-identical to V5, so the measured mean belongs to the clock alone.
#
# Why the mean and not the cap: the 12-hour limit covers the entire run, and a breach errors the
# WHOLE submission (host, discussion 743063). Safe targets - mean <= 4.3 min fits even a 150-task
# split, mean <= 5.5 min fits only ~120 tasks. V7-c is never submitted as an entry; the packer
# refuses this clock outside the v7c tree and prints a MEASUREMENT ARM banner.
#
# Two jobs on purpose. A trigger push ARMS the screen for the weekly GPU quota reset (Saturday
# 00:00 UTC) and the daily submission boundary (00:05 UTC): the arm job sleeps until then, starts
# the kernel and leaves. The waiting for the kernel itself happens in a SECOND job, because the
# sleep plus a 4-5 hour kernel would exceed the 6-hour job limit; each job gets its own budget.
# The arm job starts the launcher under `timeout` so that the launcher's own poll window is cut
# short while the kernel keeps running on Kaggle (the kernel's runtime budget is set at push time
# from --max-wait-minutes, which is why that number stays large).
#
# Read alongside GATES_V7_C.md. Nothing runs until
# gemma4-agent/kaggle_smoke/v64-benchmark.trigger or screen-v8.trigger is pushed - and note the ordering rule: a push
# that both changes a workflow file and adds a trigger path the registered definition does not
# list fires nothing (proven 2026-10-16: 2847461 -> no run, 6fc67dc -> immediate).

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v64-benchmark.trigger
      - gemma4-agent/kaggle_smoke/screen-v8.trigger

permissions:
  contents: write

concurrency:
  group: v7c-clock-screen.trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      kernel_ref: ${{ steps.kernel.outputs.kernel_ref }}
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Wait for the weekly GPU quota reset / daily boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: start_now
          MAX_WAIT_HOURS: "8"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import time
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "")
          mode = (os.environ.get("REQUESTED_MODE") or "").strip()
          if mode != "wait_boundary" and event == "workflow_dispatch":
              print("Mode: start now (manual dispatch).")
              sys.exit(0)
          # A screen-v8 config can ask to start immediately; only the v7c clock screen needs to wait
          # for the daily boundary, because it competes for the submission slot.
          _cfg = Path("gemma4-agent/kaggle_smoke/screen-v8.json")
          if _cfg.is_file() and json.loads(_cfg.read_text()).get("start_now"):
              print("Mode: start now (screen-v8 config).")
              sys.exit(0)

          max_wait = float(os.environ.get("MAX_WAIT_HOURS", "8")) * 3600
          now = dt.datetime.now(dt.timezone.utc)
          target = (now + dt.timedelta(days=1)).replace(hour=0, minute=5, second=0, microsecond=0)
          delta = (target - now).total_seconds()
          if delta > max_wait:
              print(
                  "Refusing to arm: the next quota reset / daily boundary is "
                  f"{target:%Y-%m-%d %H:%M} UTC, {delta / 3600:.1f} h away "
                  f"(limit {max_wait / 3600:.0f} h). The trigger file was left in place - push it "
                  "again closer to the boundary.",
                  flush=True,
              )
              sys.exit(1)
          if delta > 0:
              print(
                  f"Armed: waiting {delta / 60:.1f} min for {target:%Y-%m-%d %H:%M} UTC - the weekly "
                  "GPU quota reset and the daily submission boundary.",
                  flush=True,
              )
              time.sleep(delta)
          print("Boundary reached at", dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"), flush=True)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Check the launcher before spending GPU
        # Twice the launcher recorded a knob in run.json and never passed it to the notebook:
        # concurrency stayed 1 and _excluded was a NameError waiting for the first task. The
        # notebook is a string, so ast.parse on the launcher cannot see either. This fails fast.
        run: python3 gemma4-agent/tools/check_notebook_names.py

      - name: Start the screen (v7c clock screen, or a screen-v8 config if one is present)
        continue-on-error: true
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          set -uo pipefail
          if [ -f gemma4-agent/kaggle_smoke/screen-v8.json ]; then
            # A screen-v8 run is fully described by its JSON: which archive, which tasks, how many
            # at once and where the record goes. Keeping it in one file is what lets the same
            # workflow measure concurrency, a repository holdout, or an A/B pair without new code.
            OUTDIR=$(python3 -c "import json;print(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json'))['outdir'])")
            SUBMISSION=$(python3 -c "import json;print(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json'))['submission'])")
            TASKS=$(python3 -c "import json;print(','.join(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json'))['task_ids']))")
            COUNT=$(python3 -c "import json;print(len(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json'))['task_ids']))")
            CONC=$(python3 -c "import json;print(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json')).get('concurrency',1))")
            SEED=$(python3 -c "import json;print(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json')).get('seed',20261009))")
            WAIT=$(python3 -c "import json;print(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json')).get('max_wait_minutes',120))")
            echo "screen-v8: $OUTDIR | $COUNT tasks | concurrency $CONC"
            timeout 900 python gemma4-agent/tools/run_kaggle_v1_smoke.py \
              --submission "$SUBMISSION" --outdir "$OUTDIR" \
              --task-count "$COUNT" --task-ids "$TASKS" --seed "$SEED" \
              --concurrency "$CONC" --max-wait-minutes "$WAIT" --poll-interval-seconds 45
          else
            timeout 600 python gemma4-agent/tools/run_kaggle_v1_smoke.py \
              --submission gemma4-agent/submission-v7c.zip \
              --outdir gemma4-agent/kaggle_results/v7-c-benchmark \
              --task-count 30 \
              --task-id fastapi_15588 \
              --seed 20261009 \
              --max-wait-minutes 300 \
              --poll-interval-seconds 45
          fi
          code=$?
          echo "Launcher exit: $code (124 = the polling window was cut; the kernel itself continues)."
          exit 0

      - name: Expose the kernel reference for the collecting job
        id: kernel
        if: always()
        run: |
          set -uo pipefail
          ref=$(python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = Path("gemma4-agent/kaggle_smoke/screen-v8.json")
          outdir = Path(json.loads(cfg.read_text())["outdir"]) if cfg.is_file() else Path("gemma4-agent/kaggle_results/v7-c-benchmark")
          path = outdir / "run.json"
          print(json.loads(path.read_text()).get("kernel_ref", "") if path.is_file() else "")
          PY
          )
          echo "kernel_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Kernel reference recorded: ${ref:-none}"

      - name: Commit the launch record so the collecting job can read it
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          OUTDIR="gemma4-agent/kaggle_results/v7-c-benchmark"
          if [ -f gemma4-agent/kaggle_smoke/screen-v8.json ]; then
            OUTDIR=$(python3 -c "import json;print(json.load(open('gemma4-agent/kaggle_smoke/screen-v8.json'))['outdir'])")
          fi
          NAME=$(basename "$OUTDIR")
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r "$OUTDIR" /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          cp -r "/tmp/keep/$NAME" "gemma4-agent/kaggle_results/" 2>/dev/null || true
          git add "gemma4-agent/kaggle_results/$NAME" 2>/dev/null || true
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to record."
            exit 0
          fi
          git commit -m "chore(gemma): record the V7-c clock screen launch [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  collect:
    needs: arm
    if: needs.arm.outputs.kernel_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Resolve the screen directory
        id: screen
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          cfg = Path("gemma4-agent/kaggle_smoke/screen-v8.json")
          outdir = json.loads(cfg.read_text())["outdir"] if cfg.is_file() else "gemma4-agent/kaggle_results/v7-c-benchmark"
          print(f"outdir={outdir}")
          print(f"name={Path(outdir).name}")
          PY

      - name: Wait for the kernel and fetch its result
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          python gemma4-agent/tools/poll_kernel_until_done.py \
            --run-json "${{ steps.screen.outputs.outdir }}/run.json" \
            --max-wait-minutes 340 \
            --poll-interval-seconds 90

      - name: Fetch Kaggle notebook log after failure (read-only)
        if: failure()
        continue-on-error: true
        run: |
          if [ -s "${{ steps.screen.outputs.outdir }}/run.json" ]; then
            python gemma4-agent/tools/fetch_kaggle_kernel_log.py \
              --run-json "${{ steps.screen.outputs.outdir }}/run.json" \
              --output-dir "$RUNNER_TEMP/gemma-v7c-kernel-logs"
            python gemma4-agent/tools/summarize_kaggle_kernel_log.py \
              "$RUNNER_TEMP/gemma-v7c-kernel-logs/kernel.log"
          else
            echo "No Kaggle kernel reference was recorded; no log fetch attempted."
          fi

      - name: Remove raw task patches before persistence
        if: always()
        run: rm -f "${{ steps.screen.outputs.outdir }}/agent_benchmark_patches.txt"

      - name: Upload the V7-c screen summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-screen-${{ steps.screen.outputs.name }}-${{ github.run_id }}
          path: |
            ${{ steps.screen.outputs.outdir }}/run.json
            ${{ steps.screen.outputs.outdir }}/agent_benchmark_result.json
          if-no-files-found: warn

      - name: Commit the V7-c result to this branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN (see GATES_V6_3.md): take the REMOTE tree first, then re-apply this run's
          # outputs, so commits pushed while the kernel ran are never reverted.
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r "${{ steps.screen.outputs.outdir }}" /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          cp -r "/tmp/keep/${{ steps.screen.outputs.name }}" "gemma4-agent/kaggle_results/" 2>/dev/null || true
          git add "gemma4-agent/kaggle_results/${{ steps.screen.outputs.name }}" 2>/dev/null || true
          python gemma4-agent/tools/compare_screenings.py || true
          git add gemma4-agent/kaggle_results/screening_history.md || true
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v7c-benchmark.trigger \
            gemma4-agent/kaggle_smoke/screen-v8.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No result files were produced; nothing to commit."
            exit 0
          fi
          git commit -m "chore(gemma): record the V7-c clock screen result [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify documentation consistency (CI95 intervals against recorded JSON)
        if: always()
        run: python3 gemma4-agent/tools/check_docs_consistency.py
