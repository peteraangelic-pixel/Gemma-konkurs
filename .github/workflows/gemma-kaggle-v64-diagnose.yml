# V6.4 raw-trace diagnosis: what the agent ran, and what its edits did.
#
# The committed trace summaries keep tool names and targets only. Two failure buckets of the full
# V6.4 run cannot be explained from them (see ANALYSIS_2026-10-14_FAILURE_MAP.md):
#   N (11 tasks, empty tree) - three called `edit_file` and still ended with an empty diff.
#   R (8 tasks, gold file edited, tests failed) - what did those sessions run, in what order?
# This workflow downloads the V6.4 kernel output read-only, extracts every tool call with its
# arguments and the observation after it, and commits a compact report (command-head histogram,
# per-task pre-edit lists, call-level evidence for the focus tasks). No model prose is included, no
# kernel is started or stopped, and the raw traces are not committed.
#
# Nothing runs until gemma4-agent/kaggle_smoke/v64-diagnose.trigger is pushed.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v64-diagnose.trigger

permissions:
  contents: write

concurrency:
  group: v64-diagnose.trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Download the V6.4 kernel output (read-only) and diagnose the calls
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          set -uo pipefail
          REF="petersharps/gemma-agent-benchmark-aaea34e4-20261013-122940"
          mkdir -p "$RUNNER_TEMP/v64-raw"
          python3 -m kaggle kernels output "$REF" -p "$RUNNER_TEMP/v64-raw" --force \
            || echo "output fetch failed for $REF (recorded as-is)"
          echo "--- files downloaded ---"
          find "$RUNNER_TEMP/v64-raw" -maxdepth 2 -type f -printf '%10s  %p\n' | sort -k2 | head -40
          FOCUS="fastapi_14851,fastapi_14487,requests_6757,fastapi_14297,fastapi_14303,rich_3052,requests_7309,fastapi_14953,fastapi_15030,fastapi_14186,fastapi_14262"
          python3 gemma4-agent/tools/diagnose_agent_commands.py \
            --traces-dir "$RUNNER_TEMP/v64-raw" \
            --focus "$FOCUS" \
            --out gemma4-agent/analysis/diagnostics-2026-10-14/v64-raw-calls.md \
            || echo "diagnosis script failed"
          echo "--- report head ---"
          head -60 gemma4-agent/analysis/diagnostics-2026-10-14/v64-raw-calls.md 2>/dev/null || true

      - name: Commit the diagnosis with the safe pattern
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/analysis/diagnostics-2026-10-14 /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/analysis/diagnostics-2026-10-14
          cp -r /tmp/keep/diagnostics-2026-10-14/. gemma4-agent/analysis/diagnostics-2026-10-14/ 2>/dev/null || true
          git add gemma4-agent/analysis/diagnostics-2026-10-14 2>/dev/null || true
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v64-diagnose.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(gemma): raw V6.4 call diagnosis (what the empty-diff and R-bucket sessions ran) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
