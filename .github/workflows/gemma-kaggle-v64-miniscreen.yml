# V6.4 mini-screen: re-runs ONLY the six diagnosed mechanism cases instead of the whole 30-task
# sample, so each of the four prompt rules (M1-M4) is checked on the task that produced the zero:
#   rich_3105      M1 (quick empty tree)      - edit must appear at all, and by call 4
#   rich_3043      M1 (medium empty tree)     - same, non-trivial task
#   fastapi_15030  M2 (9 failed edits in a row) - rescue rule must break the loop
#   requests_6757  M3 (48 submit_patch calls) - tool removed, so the loop cannot repeat
#   fastapi_15745  M4 (only /tmp/locate.py written) - a repository edit must exist
#   fastapi_14077  M3 control, V6.3 PASSED  - regression check on the only solved task here
# Baseline for exactly these six in V6.3 (from trace-operations.json, not memory):
#   1/6 PASS, 3/6 any edit, 0/6 repository edit within call 4, 5/6 empty trees.
# Pre-registered expectations P1-P5 and the falsification rule: gemma4-agent/GATES_V6_4.md
# Does not create an official submission. Nothing runs until
# gemma4-agent/kaggle_smoke/v64-miniscreen.trigger is pushed.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v64-miniscreen.trigger

permissions:
  contents: write

concurrency:
  group: v64-miniscreen.trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Run the V6.4 mini-screen (6 mechanism tasks) on competition L4x4
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          python gemma4-agent/tools/run_kaggle_v1_smoke.py \
            --submission gemma4-agent/submission-v6.zip \
            --outdir gemma4-agent/kaggle_results/v6-4-miniscreen \
            --task-ids rich_3105,rich_3043,fastapi_15030,requests_6757,fastapi_15745,fastapi_14077 \
            --task-id rich_3105 \
            --seed 20261009 \
            --max-wait-minutes 240 \
            --poll-interval-seconds 60

      - name: Fetch Kaggle notebook log after failure (read-only)
        if: failure()
        continue-on-error: true
        run: |
          if [ -s gemma4-agent/kaggle_results/v6-4-miniscreen/run.json ]; then
            python gemma4-agent/tools/fetch_kaggle_kernel_log.py \
              --run-json gemma4-agent/kaggle_results/v6-4-miniscreen/run.json \
              --output-dir "$RUNNER_TEMP/gemma-v64-miniscreen-kernel-logs"
            python gemma4-agent/tools/summarize_kaggle_kernel_log.py \
              "$RUNNER_TEMP/gemma-v64-miniscreen-kernel-logs/kernel.log"
          else
            echo "No Kaggle kernel reference was recorded; no log fetch attempted."
          fi

      - name: Remove raw task patches before persistence
        if: always()
        run: rm -f gemma4-agent/kaggle_results/v6-4-miniscreen/agent_benchmark_patches.txt

      - name: Upload V6 benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v64-miniscreen-${{ github.run_id }}
          path: |
            gemma4-agent/kaggle_results/v6-4-miniscreen/run.json
            gemma4-agent/kaggle_results/v6-4-miniscreen/agent_benchmark_result.json
          if-no-files-found: warn

      - name: Upload Kaggle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v64-miniscreen-kernel-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gemma-v64-miniscreen-kernel-logs/
          if-no-files-found: warn
          retention-days: 3

      - name: Commit V6 benchmark summary to this branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN - fixed 2026-10-13, after it destroyed this branch once.
          # The previous 'git reset --soft origin/<branch>' moves HEAD but leaves the INDEX on
          # this job's own, older checkout, so the results commit rebuilt the OLD tree and
          # silently reverted every commit pushed while the kernel ran.
          # Safe order: take the REMOTE tree first, then re-apply only this run's outputs.
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/kaggle_results/v6-4-miniscreen /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          cp -r /tmp/keep/v6-4-miniscreen gemma4-agent/kaggle_results/ 2>/dev/null || true
          git add gemma4-agent/kaggle_results/v6-4-miniscreen 2>/dev/null || true
          python gemma4-agent/tools/compare_screenings.py || true
          git add gemma4-agent/kaggle_results/screening_history.md || true
          # the trigger file exists exactly while a run has not consumed it yet
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v64-miniscreen.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No result files were produced; nothing to commit."
            exit 0
          fi
          git commit -m "chore(gemma): record Run the V6.4 mini-screen (6 mechanism tasks) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify documentation consistency (CI95 intervals against recorded JSON)
        if: always()
        run: python3 gemma4-agent/tools/check_docs_consistency.py
