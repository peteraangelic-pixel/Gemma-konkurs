# V6.5 mini-screen: the same six mechanism tasks as V6.4, so the comparison is paired (same tasks,
# same seed, same kernel shape). V6.5 = V6.4 + one lever: the edit-decision framing (a rough first
# edit is expected, and the line between an intended edit and a dummy is intent, not accuracy).
#
# Why this lever: in the V6.5 mini-screen the call-4 deadline was ignored in 6/6 tasks (repository
# edits within call 4: 0/6, median at call 7), and the three empty trees were not clock deaths -
# rich_3105 made 15 run_command calls in 107 s and stopped by itself, rich_3043 ran 322.7 s, and
# fastapi_15745 read one file ten times over 336.7 s. Every session that edited produced a patch.
#
# Pre-registered expectations Q1-Q4 and the falsification rule: gemma4-agent/GATES_V6_5.md
# Does not create an official submission. Nothing runs until
# gemma4-agent/kaggle_smoke/v65-miniscreen.trigger is pushed.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v65-miniscreen.trigger

permissions:
  contents: write

concurrency:
  group: v65-miniscreen.trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Run the V6.5 mini-screen (6 mechanism tasks) on competition L4x4
        env:
          KAGGLE_USERNAME: petersharps
        run: |
          python gemma4-agent/tools/run_kaggle_v1_smoke.py \
            --submission gemma4-agent/submission-v6.5.zip \
            --outdir gemma4-agent/kaggle_results/v6-5-miniscreen \
            --task-ids rich_3105,rich_3043,fastapi_15030,requests_6757,fastapi_15745,fastapi_14077 \
            --task-id rich_3105 \
            --seed 20261009 \
            --max-wait-minutes 240 \
            --poll-interval-seconds 60

      - name: Fetch Kaggle notebook log after failure (read-only)
        if: failure()
        continue-on-error: true
        run: |
          if [ -s gemma4-agent/kaggle_results/v6-5-miniscreen/run.json ]; then
            python gemma4-agent/tools/fetch_kaggle_kernel_log.py \
              --run-json gemma4-agent/kaggle_results/v6-5-miniscreen/run.json \
              --output-dir "$RUNNER_TEMP/gemma-v65-miniscreen-kernel-logs"
            python gemma4-agent/tools/summarize_kaggle_kernel_log.py \
              "$RUNNER_TEMP/gemma-v65-miniscreen-kernel-logs/kernel.log"
          else
            echo "No Kaggle kernel reference was recorded; no log fetch attempted."
          fi

      - name: Remove raw task patches before persistence
        if: always()
        run: rm -f gemma4-agent/kaggle_results/v6-5-miniscreen/agent_benchmark_patches.txt

      - name: Upload V6 benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v65-miniscreen-${{ github.run_id }}
          path: |
            gemma4-agent/kaggle_results/v6-5-miniscreen/run.json
            gemma4-agent/kaggle_results/v6-5-miniscreen/agent_benchmark_result.json
          if-no-files-found: warn

      - name: Upload Kaggle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-v65-miniscreen-kernel-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gemma-v65-miniscreen-kernel-logs/
          if-no-files-found: warn
          retention-days: 3

      - name: Commit V6 benchmark summary to this branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN - fixed 2026-10-13, after it destroyed this branch once.
          # The previous 'git reset --soft origin/<branch>' moves HEAD but leaves the INDEX on
          # this job's own, older checkout, so the results commit rebuilt the OLD tree and
          # silently reverted every commit pushed while the kernel ran.
          # Safe order: take the REMOTE tree first, then re-apply only this run's outputs.
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/kaggle_results/v6-5-miniscreen /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          cp -r /tmp/keep/v6-5-miniscreen gemma4-agent/kaggle_results/ 2>/dev/null || true
          git add gemma4-agent/kaggle_results/v6-5-miniscreen 2>/dev/null || true
          python gemma4-agent/tools/compare_screenings.py || true
          git add gemma4-agent/kaggle_results/screening_history.md || true
          # the trigger file exists exactly while a run has not consumed it yet
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v65-miniscreen.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No result files were produced; nothing to commit."
            exit 0
          fi
          git commit -m "chore(gemma): record Run the V6.5 mini-screen (6 mechanism tasks) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify documentation consistency (CI95 intervals against recorded JSON)
        if: always()
        run: python3 gemma4-agent/tools/check_docs_consistency.py
