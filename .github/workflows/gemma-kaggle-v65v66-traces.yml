# V6.5 and V6.6 read-only trace summaries (both full 30-task runs). download its outputs
# (read-only), extract the per-task operational traces and compute the M5 metrics
# (write coverage, repository-edit coverage, first-edit call index, consecutive-run lengths).
#
# Handles BOTH 30-task kernels in one run, so P/R expectations (locator trap count, first-edit
# call index, submit absence) can be evaluated for the two candidates side by side. Reads each
# kernel reference from the committed run.json, skipping a folder whose run has not landed yet.
# The raw trace_*.json files are deliberately NOT committed; only the summaries are.
# Nothing runs until gemma4-agent/kaggle_smoke/v65v66-traces.trigger is pushed.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c4eeb067-gemma-konkurs
    paths:
      - gemma4-agent/kaggle_smoke/v65v66-traces.trigger

permissions:
  contents: write

concurrency:
  group: v65v66-traces.trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  traces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Repository Actions secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle CLI configured; token value was not logged."

      - name: Download kernel outputs (read-only) and summarise traces
        run: |
          set -euo pipefail
          for FOLDER in v6-5-benchmark v6-6-benchmark; do
            RUN_JSON="gemma4-agent/kaggle_results/$FOLDER/run.json"
            if [ ! -s "$RUN_JSON" ]; then
              echo "SKIP $FOLDER: no run.json yet (that kernel has not recorded its reference)."
              continue
            fi
            REF=$(python3 -c "import json;print(json.load(open('$RUN_JSON'))['kernel_ref'])")
            echo "=== $FOLDER -> $REF ==="
            mkdir -p "$RUNNER_TEMP/traces/$FOLDER"
            python -m kaggle kernels output "$REF" -p "$RUNNER_TEMP/traces/$FOLDER/$(basename "$REF")" \
              || echo "output fetch failed for $REF (recorded as-is)"
            find "$RUNNER_TEMP/traces/$FOLDER" -name 'trace_*.json' -printf '%10s  %p\n' | head -20
            python3 gemma4-agent/tools/summarize_agent_traces.py \
              --traces-dir "$RUNNER_TEMP/traces/$FOLDER" \
              --out "gemma4-agent/kaggle_results/$FOLDER/traces"
            echo "--- aggregate $FOLDER ---"
            cat "gemma4-agent/kaggle_results/$FOLDER/traces/trace-aggregate.md"
          done

      - name: Commit trace summaries with the safe pattern
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # SAFE PATTERN - see the other workflows (2026-10-13 incident).
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r gemma4-agent/kaggle_results/v6-4-benchmark /tmp/keep/ 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p gemma4-agent/kaggle_results
          cp -r /tmp/keep/v6-4-benchmark gemma4-agent/kaggle_results/ 2>/dev/null || true
          # keep raw traces out of git, exactly as in V6.3
          rm -f gemma4-agent/kaggle_results/v6-4-benchmark/traces/trace_*.json
          git add -f gemma4-agent/kaggle_results/v6-4-benchmark/traces 2>/dev/null || true
          git rm -q --ignore-unmatch gemma4-agent/kaggle_smoke/v65v66-traces.trigger
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to commit: no trace summaries were produced."
            exit 0
          fi
          git commit -m "chore(gemma): record V6.5/V6.6 trace summaries [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify documentation consistency (CI95 intervals against recorded JSON)
        if: always()
        run: python3 gemma4-agent/tools/check_docs_consistency.py
