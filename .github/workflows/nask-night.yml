name: nask-night-hunt

# Kuratowane, read-only sondy na programy hack.cert.pl. Tylko ręczne uruchomienie.
# Zasady: hosty wyłącznie z NASK/tools/nasktriage/scope.example.json, tempo 2 req/s,
# brak ciał żądań, brak logowania, brak podążania za przekierowaniami poza zakres.
on:
  # workflow_dispatch wymaga pliku na gałęzi domyślnej (main), a ta sesja pushuje tylko na
  # arena/c4eeb067-gemma-konkurs. Dlatego odpalamy to pushem na zmianę w narzędziu lub w checkach.
  push:
    paths:
      - "NASK/tools/naskhunt/**"
      - ".github/workflows/nask-night.yml"
  workflow_dispatch:
    inputs:
      rps:
        description: "żądania na sekundę (sufit regulaminu: 5)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NASK/tools/naskhunt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: NASK/tools/naskhunt

      - name: build
        run: cargo build --release

      - name: sondy
        env:
          RPS: ${{ github.event.inputs.rps || '2' }}
        run: |
          set -o pipefail
          ./target/release/naskhunt \
            --scope ../nasktriage/scope.example.json \
            --checks checks.json \
            --rps "${RPS}" \
            --md ../../../NASK/hunt/report-$(date -u +%Y%m%dT%H%MZ).md \
            --json ../../../NASK/hunt/report-$(date -u +%Y%m%dT%H%MZ).json \
            | tee ../../../NASK/hunt/last-run.log

      - name: mapa API z bundle'i JS (raz na dobe, tryb --grep)
        continue-on-error: true
        if: github.event.inputs.mapa == 'tak'
        run: |
          ./target/release/naskmap \
            --scope ../nasktriage/scope.example.json \
            --hosts "science.nask.pl,116sos.pl,zglos-dezinformacje.nask.pl,bezpiecznymiesiac.pl" \
            --max-scripts 25 \
            --md ../../../NASK/hunt/MAP-$(date -u +%Y%m%dT%H%MZ).md \
            | tail -10

      - name: publikuj
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p NASK/hunt
          git config user.name "nask-hunt"
          git config user.email "nask-hunt@users.noreply.github.com"
          git add -f NASK/hunt/
          if git diff --cached --quiet; then echo "brak nowych wyników"; else
            git commit -q -m "hunt: wyniki sond $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push origin HEAD:arena/c4eeb067-gemma-konkurs
          fi
