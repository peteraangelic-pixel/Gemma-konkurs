# Praca sieciowa dla projektu NASK (hack.cert.pl).
#
# Po co na Actions: sandbox agenta nie ma dostępu do tych hostów, a runner GitHub
# ma normalne wyjście do internetu. Reguły konkursu obowiązują tak samo tutaj,
# więc workflow nie robi nic, czego nie wolno: ~20 żądań, 4,5 req/s, wyłącznie
# hosty z nask/tools/scope.py, zero testów obciążeniowych.
#
# JAK URUCHOMIĆ — dwie drogi, obie bez wklejania haseł:
#
# 1. Push pliku-flagi `nask/RUN-RECON` (tak działa dziś, bo `main` nie ma jeszcze
#    tego workflow, a `workflow_dispatch` wymaga pliku na gałęzi domyślnej):
#       echo "run $(date -u +%FT%TZ)" >> nask/RUN-RECON && git push
# 2. Actions → nask-recon → Run workflow (zadziała, gdy workflow trafi na `main`,
#    np. po scaleniu PR-a).
#
# Trigger jest celowo wąski (`nask/RUN-RECON`): zmiana kodu w `nask/*.py` NIE
# wysyła żadnych żądań do celów. Sieć uruchamia się tylko wtedy, gdy ktoś
# świadomie podniesie flagę.
# Sekrety (opcjonalne, do testów uwierzytelnionych z WŁASNYCH kont):
#   Settings → Secrets and variables → Actions → New repository secret
#   NASK_COOKIE_MWDBCERTPL = "session=..."
#   (zasady i formaty: nask/tools/credentials.py)
name: nask-recon

on:
  push:
    paths:
      - "nask/RUN-RECON"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tylko walidacja scope, bez wysyłania żądań"
        type: boolean
        default: false
      auth:
        description: "Dołącz poświadczenia z sekretów NASK_COOKIE_* / NASK_TOKEN_*"
        type: boolean
        default: false
      hosts:
        description: "Własna lista URL-i po przecinku (puste = domyślne cele)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: nask-recon
  cancel-in-progress: false

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalacja pytest
        run: python -m pip install --quiet pytest
      - name: testy offline (bez sieci)
        run: python -m pytest nask/tools/tests -q
      - name: scope zgodny z regulaminem
        run: |
          python nask/nask.py scope --list
          python nask/nask.py scope hack.cert.pl
          python nask/nask.py scope ctf.hack.cert.pl
          if python nask/nask.py scope gov.pl; then echo "BLAD: gov.pl nie jest w scope"; exit 1; fi
          if python nask/nask.py scope eobieg.wladyslawowo.pl; then echo "BLAD: program wylaczony"; exit 1; fi
          echo "scope OK"
      - name: brak poświadczeń w plikach
        run: python nask/security_scan.py

  rekonesans:
    needs: testy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: rekonesans pasywny (~20 żądań, 4,5 req/s)
        env:
          # Poświadczenia wchodzą wyłącznie przez env z sekretów. Nie są drukowane
          # i nie trafiają do artefaktu: credentials.audit() pokazuje tylko nazwy
          # hostów i status "ustawiony"/"brak".
          NASK_COOKIE_MWDBCERTPL: ${{ secrets.NASK_COOKIE_MWDBCERTPL }}
          NASK_COOKIE_N6PORTALCERTPL: ${{ secrets.NASK_COOKIE_N6PORTALCERTPL }}
          NASK_COOKIE_MOJECERTPL: ${{ secrets.NASK_COOKIE_MOJECERTPL }}
          NASK_COOKIE_INCYDENTCERTPL: ${{ secrets.NASK_COOKIE_INCYDENTCERTPL }}
          NASK_COOKIE_DATAANNOTATIONPLLUMORGPL: ${{ secrets.NASK_COOKIE_DATAANNOTATIONPLLUMORGPL }}
          NASK_COOKIE_KOMUNIKATORNARODOWYGOVPL: ${{ secrets.NASK_COOKIE_KOMUNIKATORNARODOWYGOVPL }}
        run: |
          # `set +e` + przechwycenie logu: potrzebujemy treści błędu, nie tylko
          # kodu wyjścia. Bez tego debugowanie zdalne to zgadywanie.
          set +e
          INPUT_DRY="${{ inputs.dry_run }}"
          INPUT_AUTH="${{ inputs.auth }}"
          INPUT_HOSTS="${{ inputs.hosts }}"
          ARGS=()
          # Przy triggerze `push` wartości inputs.* są puste — dlatego każdy
          # warunek porównuje do "true", a nie polega na prawdziwości.
          if [ "$INPUT_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$INPUT_AUTH" = "true" ]; then ARGS+=(--auth); fi
          if [ -n "$INPUT_HOSTS" ]; then ARGS+=(--hosts "$INPUT_HOSTS"); fi
          python nask/recon.py "${ARGS[@]+"${ARGS[@]}"}" 2>&1 | tee /tmp/recon.log
          CODE=${PIPESTATUS[0]}
          echo "kod wyjścia recon.py: $CODE"
          if [ "$CODE" -ne 0 ]; then
            python nask/fail_annotation.py /tmp/recon.log
          fi
          exit "$CODE"

      - name: podsumowanie (Step Summary)
        if: always()
        run: python nask/summary.py >> "$GITHUB_STEP_SUMMARY"

      # Ten krok istnieje, bo agent nie może pobrać artefaktu ani logu.
      # Adnotacje są w api.github.com, więc to jedyny kanał, którym wynik
      # rekonesansu dociera do miejsca, gdzie da się go przeczytać.
      - name: wyniki jako adnotacje (kanał odczytu dla agenta)
        if: always()
        run: python nask/annotate.py nask/findings/recon.json

      - name: artefakt (dowody + kandydaci)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nask-recon-${{ github.run_id }}
          path: |
            nask/findings/recon.json
            nask/findings/evidence.jsonl
          if-no-files-found: warn
          retention-days: 30
