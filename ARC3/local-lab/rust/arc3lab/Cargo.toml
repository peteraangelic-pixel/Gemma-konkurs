[package]
name = "arc3lab"
version = "0.1.0"
edition = "2021"
description = "16-core harness for the ARC-AGI-3 local lab: exact taaf scoring, marginal level allocation, parallel sweep"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
