[package]
name = "naskhunt"
version = "0.1.0"
edition = "2021"
description = "Bounded, read-only probe set for hack.cert.pl programs (scope-guarded, <=5 req/s)"
license = "MIT"

[dependencies]
nasktriage = { path = "../nasktriage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["tls"] }
regex = "1"
