# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
agent_class: LlmAgent
name: gemma4_repo_fixer
model: gemma-4-31b-it-qat-w4a16-ct
description: A time-aware software repair agent that localizes issues efficiently, makes minimal fixes, validates them, and submits a patch.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
skills:
  - skills/targeted-tests
  - skills/patch-validation
