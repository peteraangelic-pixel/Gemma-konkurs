# V8 - V5's budget envelope, unchanged (150 s / 45 calls / 80 turns / 5.25 min).
# The one lever under test lives in prompts/system.md: the edit gets verified and the failure
# gets corrected, instead of the session ending on an unrun edit. Budget numbers are identical
# to V5 on purpose - the 12-hour envelope is the one thing that must not move in an A/B.
#
# Measured facts this is built on (see DIAGNOSIS.md):
# - The competition grants 12 hours for ALL tasks, *including* per-task sandbox setup
#   (~30-60 s/task) and excluding patch validation. The scored split is ~120 tasks, so
#   the safe envelope is 120 * (5.25 min + 0.5 min) = 11.5 h when every task hits the cap.
# - Peers calibrated on the same Kaggle 4xL4 hardware report ~8.7 s per model call with
#   thinking enabled, so ~45 tool calls is roughly the ceiling a 5.25-minute session can
#   reach; the call cap is therefore a safety net, not the binding constraint.
# - The harness injects an extra "budget_warning" field into tool results once 20 calls
#   are used and <=10 remain, i.e. from call 35 with this cap. That is a free pacing cue
#   that costs no model call (unlike get_status).
evaluation:
  timeout_seconds: 150
  max_tool_calls: 45
  max_turns: 80
  max_time_minutes: 5.25
